<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻味珍馐 - 美食之旅</title>
    <style>
        /* 基础样式设置 */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }

        /* 导航栏 */
        header {
            background-color: #fff;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e67e22;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #555;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #e67e22;
        }

        /* 英雄横幅区 */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* 美食卡片展示 */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            color: #2c3e50;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1-fr));
            gap: 2rem;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-content h3 {
            margin-top: 0;
            color: #e67e22;
        }

        /* 页脚 */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .food-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍴 寻味珍馐</div>
        <nav>
            <a href="#">首页</a>
            <a href="#">经典菜谱</a>
            <a href="#">关于我们</a>
        </nav>
    </header>

    <section class="hero">
        <h1>发现食物的温度</h1>
        <p>探索全球特色美食，分享每一份烹饪的快乐</p>
    </section>

    <main class="container">
        <h2 class="section-title">今日推荐</h2>
        
        <div class="food-grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80" alt="健康沙拉">
                <div class="card-content">
                    <h3>缤纷牛油果沙拉</h3>
                    <p>精选新鲜牛油果，搭配有机圣女果与秘制油醋汁，开启清爽的一天。</p>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=500&q=80" alt="披萨">
                <div class="card-content">
                    <h3>意式那不勒斯披萨</h3>
                    <p>传统手工拉制饼底，浓郁芝士与新鲜罗勒的完美碰撞。</p>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=500&q=80" alt="甜点">
                <div class="card-content">
                    <h3>经典浆果甜甜圈</h3>
                    <p>口感松软，外焦里嫩，搭配手工熬制的森林莓果酱。</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 寻味珍馐 美食博客 | 记录生活中的每一份美味</p>
    </footer>

</body>
</html>
